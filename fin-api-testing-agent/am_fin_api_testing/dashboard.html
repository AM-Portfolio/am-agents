<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/lucide@0.294.0"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.5/dist/framer-motion.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: "#0a0a0c",
                        card: "#121216",
                        border: "#1d1d26",
                        neonCyan: "#00f3ff",
                        neonPurple: "#bc13fe",
                        success: "#00ff9d",
                        error: "#ff4d4d",
                        warning: "#ffcc00",
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                }
            }
        }
    </script>
    <style>
        body { background-color: #0a0a0c; color: white; -webkit-font-smoothing: antialiased; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .neon-glow-cyan { box-shadow: 0 0 20px rgba(0, 243, 255, 0.15); }
        .neon-glow-purple { box-shadow: 0 0 20px rgba(188, 19, 254, 0.15); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0, 243, 255, 0.3); border-radius: 4px; border: 2px solid transparent; background-clip: content-box; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(0, 243, 255, 0.5); border: 2px solid transparent; background-clip: content-box; }
        
        /* Premium Markdown & Chat Styling */
        .assistant-bubble { background: rgba(18, 18, 22, 0.8) !important; border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        .user-bubble { background: linear-gradient(135deg, #bc13fe 0%, #7c00ff 100%) !important; color: white !important; font-weight: 500; box-shadow: 0 10px 20px rgba(188, 19, 254, 0.2); }
        
        .dashboard-markdown { font-family: 'Inter', sans-serif; color: rgba(255,255,255,0.85); width: 100%; overflow-x: auto; }
        .dashboard-markdown h1, .dashboard-markdown h2, .dashboard-markdown h3 { color: #00f3ff; font-weight: 700; margin-top: 1.5rem; margin-bottom: 0.5rem; }
        .dashboard-markdown p { margin-bottom: 1rem; line-height: 1.6; }
        .dashboard-markdown strong { color: #00f3ff; font-weight: 700; }
        .dashboard-markdown table { min-width: 100%; border-collapse: separate; border-spacing: 0; margin-block: 1.5rem; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; overflow: hidden; table-layout: auto; }
        .dashboard-markdown th { background: rgba(0, 243, 255, 0.1); color: #00f3ff; font-size: 10px; font-weight: 900; text-transform: uppercase; padding: 12px 14px; border-bottom: 1px solid rgba(0, 243, 255, 0.2); text-align: left; letter-spacing: 1px; }
        .dashboard-markdown td { padding: 10px 14px; font-size: 11px; border-bottom: 1px solid rgba(255,255,255,0.05); vertical-align: middle; white-space: nowrap; }
        .dashboard-markdown tr:last-child td { border-bottom: none; }
        .dashboard-markdown tr:hover td { background: rgba(255,255,255,0.03); }
        .dashboard-markdown ul, .dashboard-markdown ol { padding-left: 1.25rem; margin-bottom: 1rem; list-style-type: disc; }
        .dashboard-markdown li { margin-bottom: 0.5rem; }
        .dashboard-markdown code { background: rgba(255, 255, 255, 0.1); padding: 2px 6px; border-radius: 6px; color: #ff00ff; font-family: 'JetBrains Mono', monospace; font-size: 0.9em; border: 1px solid rgba(255,255,255,0.05); }
        .dashboard-markdown pre { background: #050507 !important; padding: 1.25rem !important; border-radius: 20px !important; border: 1px solid rgba(255,255,255,0.05) !important; margin-block: 1rem !important; overflow-x: auto; width: 100%; }
        .dashboard-markdown pre code { background: transparent !important; border: none !important; padding: 0 !important; color: #e0e0e0 !important; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        const { useState, useEffect, useRef } = React;
        const { motion, AnimatePresence } = window.Motion || { motion: ({children}) => children, AnimatePresence: ({children}) => children };
        
        // ─── Error Boundary to prevent full-page black screen ─────────────────────
        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false, error: null }; }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            componentDidCatch(error, info) { 
                console.error('[ErrorBoundary] Caught error:', error);
                console.error('[ErrorBoundary] Error info:', info);
            }
            render() {
                if (this.state.hasError) {
                    return React.createElement('div', { style: { padding: '40px', color: '#ff4d4d', fontFamily: 'monospace', background: '#0a0a0c', minHeight: '100vh', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', textAlign: 'center' } },
                        React.createElement('h2', { style: { fontSize: '24px', fontWeight: '900', marginBottom: '16px' } }, '⚠️ Dashboard Runtime Error'),
                        React.createElement('div', { style: { background: '#1a1a20', padding: '20px', borderRadius: '12px', border: '1px solid #ff4d4d33', maxWidth: '800px', width: '100%' } },
                            React.createElement('pre', { style: { whiteSpace: 'pre-wrap', color: '#ff8a8a', fontSize: '12px', textAlign: 'left' } }, String(this.state.error))
                        ),
                        React.createElement('button', {
                            onClick: () => { window.location.reload(); },
                            style: { marginTop: '24px', padding: '12px 32px', background: '#00f3ff22', border: '1px solid #00f3ff', color: '#00f3ff', borderRadius: '12px', cursor: 'pointer', fontWeight: 'bold', textTransform: 'uppercase', letterSpacing: '1px' }
                        }, 'Reload Application')
                    );
                }
                return this.props.children;
            }
        }

        // ─── Safe Lucide Icon ─────────────────────────────────────────────────────
        const LucideIcon = ({ name, className }) => {
            const containerRef = useRef(null);
            useEffect(() => {
                if (!name || !window.lucide || !containerRef.current) return;
                try {
                    const kebab = name.replace(/([a-z])([A-Z])/g, '$1-$2').toLowerCase();
                    containerRef.current.innerHTML = `<i data-lucide="${kebab}" class="${className}"></i>`;
                    window.lucide.createIcons({ 
                        root: containerRef.current,
                        attrs: { class: className }
                    });
                } catch(e) { /* ignore */ }
            }, [name, className]);
            if (!name) return null;
            return React.createElement('span', { ref: containerRef, className: 'inline-flex items-center justify-center' });
        };

        const Markdown = ({ content }) => {
            const [html, setHtml] = useState(content || '');
            
            useEffect(() => {
                if (!content) return;
                
                const processMarkdown = () => {
                    const markedLib = window.marked || (typeof marked !== 'undefined' ? marked : null);
                    
                    if (markedLib) {
                        try {
                            const options = { gfm: true, breaks: true, tables: true };
                            const result = markedLib.parse ? markedLib.parse(content, options) : markedLib(content, options);
                            setHtml(result);
                        } catch (err) {
                            console.error("Markdown parse failed:", err);
                            setHtml(fallbackMarkdown(content));
                        }
                    } else {
                        setHtml(fallbackMarkdown(content));
                    }
                };

                const fallbackMarkdown = (text) => {
                    return text
                        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                        .replace(/\*(.*?)\*/g, '<em>$1</em>')
                        .replace(/```(\w+)?\n([\s\S]*?)```/g, '<pre><code class="language-$1">$2</code></pre>')
                        .replace(/`(.*?)`/g, '<code>$1</code>')
                        .replace(/\n\n/g, '<p></p>')
                        .replace(/\n/g, '<br>');
                };

                processMarkdown();
                
                if (!(window.marked || (typeof marked !== 'undefined' ? marked : null))) {
                    const timer = setTimeout(processMarkdown, 1000);
                    return () => clearTimeout(timer);
                }
            }, [content]);

            return React.createElement('div', { 
                dangerouslySetInnerHTML: { __html: html },
                className: 'dashboard-markdown w-full break-words space-y-2' 
            });
        };

        const ApiTestWidget = ({ data }) => {
            if (!data) return null;
            const { status, url, method, response, operation_id } = data;
            const isSuccess = status >= 200 && status < 300;

            return React.createElement('div', { className: 'space-y-4' },
                React.createElement('div', { className: 'flex items-center justify-between' },
                    React.createElement('div', { className: 'flex items-center gap-3' },
                        React.createElement('span', { className: `px-3 py-1 rounded-lg text-[9px] font-black uppercase tracking-wider ${isSuccess ? 'bg-success/20 text-success' : 'bg-error/20 text-error'}` }, isSuccess ? 'PASS' : 'FAIL'),
                        React.createElement('span', { className: 'text-[10px] font-mono text-gray-400' }, operation_id || 'API Request')
                    ),
                    React.createElement('span', { className: 'text-[10px] font-bold text-gray-600' }, `Status: ${status}`)
                ),
                React.createElement('div', { className: 'bg-black/40 rounded-xl p-4 border border-white/5 space-y-2' },
                    React.createElement('div', { className: 'flex items-start gap-2' },
                        React.createElement('span', { className: 'text-[10px] font-black text-neonCyan uppercase w-12 pt-0.5' }, method),
                        React.createElement('span', { className: 'text-[10px] font-mono text-gray-300 break-all' }, url)
                    )
                ),
                React.createElement('div', { className: 'max-h-48 overflow-y-auto custom-scrollbar bg-black/60 rounded-xl p-4 border border-white/5' },
                    React.createElement('pre', { className: 'text-[10px] font-mono text-gray-400 whitespace-pre-wrap' }, 
                        typeof response === 'object' ? JSON.stringify(response, null, 2) : String(response)
                    )
                )
            );
        };

        const HoldingsTable = ({ data }) => {
            if (!data || !Array.isArray(data)) return null;
            return React.createElement('div', { className: 'overflow-x-auto custom-scrollbar -mx-4' },
                React.createElement('table', { className: 'w-full text-left border-collapse' },
                    React.createElement('thead', { className: 'bg-white/5 border-y border-white/5' },
                        React.createElement('tr', null,
                            ['Symbol', 'Shares', 'Price', 'Value'].map(h => React.createElement('th', { key: h, className: 'px-4 py-3 text-[9px] font-black uppercase text-gray-500' }, h))
                        )
                    ),
                    React.createElement('tbody', null,
                        data.slice(0, 5).map((row, i) => React.createElement('tr', { key: i, className: 'border-b border-white/5' },
                            React.createElement('td', { className: 'px-4 py-3 text-[10px] font-bold text-neonCyan' }, row.symbol || row.Symbol),
                            React.createElement('td', { className: 'px-4 py-3 text-[10px] text-gray-300' }, row.shares || row.Quantity || row.quantity),
                            React.createElement('td', { className: 'px-4 py-3 text-[10px] text-gray-300' }, `$${row.price || row.Price || 0}`),
                            React.createElement('td', { className: 'px-4 py-3 text-[10px] font-bold text-white' }, `$${(row.value || row.Value || 0).toLocaleString()}`)
                        ))
                    )
                ),
                data.length > 5 && React.createElement('div', { className: 'p-3 text-center text-[9px] text-gray-600 italic' }, `+ ${data.length - 5} more items`)
            );
        };

        const PortfolioSummary = ({ data }) => {
            if (!data) return null;
            return React.createElement('div', { className: 'grid grid-cols-2 gap-4' },
                React.createElement('div', { className: 'bg-white/5 p-4 rounded-2xl border border-white/5' },
                    React.createElement('p', { className: 'text-[8px] uppercase text-gray-500 mb-1' }, 'Total Value'),
                    React.createElement('p', { className: 'text-lg font-black text-neonCyan' }, `$${(data.total_value || 0).toLocaleString()}`)
                ),
                React.createElement('div', { className: 'bg-white/5 p-4 rounded-2xl border border-white/5' },
                    React.createElement('p', { className: 'text-[8px] uppercase text-gray-500 mb-1' }, 'Day Change'),
                    React.createElement('p', { className: `text-lg font-black ${data.day_change >= 0 ? 'text-success' : 'text-error'}` }, 
                        `${data.day_change >= 0 ? '+' : ''}${data.day_change_percent || 0}%`
                    )
                )
            );
        };

        const TopMovers = ({ data }) => {
            if (!data || !Array.isArray(data)) return null;
            return React.createElement('div', { className: 'space-y-3' },
                data.slice(0, 4).map((m, i) => React.createElement('div', { key: i, className: 'flex justify-between items-center p-3 bg-white/5 rounded-xl border border-white/5' },
                    React.createElement('div', null,
                        React.createElement('p', { className: 'text-xs font-bold text-white' }, m.symbol),
                        React.createElement('p', { className: 'text-[9px] text-gray-500' }, m.name)
                    ),
                    React.createElement('div', { className: 'text-right' },
                        React.createElement('p', { className: 'text-xs font-bold' }, `$${m.price}`),
                        React.createElement('p', { className: `text-[10px] font-bold ${m.change >= 0 ? 'text-success' : 'text-error'}` }, 
                            `${m.change >= 0 ? '+' : ''}${m.change_percent}%`
                        )
                    )
                ))
            );
        };

        const ManualTestModal = ({ endpoint, onClose, onRun, sessionId }) => {
            const [payload, setPayload] = useState('{}');
            const [headers, setHeaders] = useState('{\n  "Content-Type": "application/json"\n}');
            const [isGenerating, setIsGenerating] = useState(false);
            const [isExecuting, setIsExecuting] = useState(false);
            const [apiDetails, setApiDetails] = useState(null);
            const [executionResult, setExecutionResult] = useState(null);
            const [showSchema, setShowSchema] = useState(false);

            useEffect(() => {
                fetchDetails();
                generatePayload();
            }, [endpoint.operationId]);

            const fetchDetails = async () => {
                try {
                    const resp = await axios.get(`/api/v1/meta/apis/${endpoint.operationId}`);
                    setApiDetails(resp.data);
                } catch (err) { console.error("Failed to fetch API details", err); }
            };

            const generatePayload = async () => {
                setIsGenerating(true);
                try {
                    const templateResp = await axios.get(`/api/v1/meta/test/template/${endpoint.operationId}`);
                    setPayload(JSON.stringify(templateResp.data, null, 2));
                } catch (err) { console.error("Failed to generate payload", err); }
                finally { setIsGenerating(false); }
            };

            const handleExecute = async () => {
                let parsedPayload, parsedHeaders;
                try {
                    parsedPayload = JSON.parse(payload);
                } catch (err) {
                    setExecutionResult({ status: 'error', error: 'Invalid JSON payload. Please check your syntax.' });
                    return;
                }
                try {
                    parsedHeaders = JSON.parse(headers);
                } catch (err) {
                    setExecutionResult({ status: 'error', error: 'Invalid JSON headers. Please check your syntax.' });
                    return;
                }

                setIsExecuting(true);
                setExecutionResult(null);
                try {
                    const result = await onRun(endpoint.operationId, parsedPayload, parsedHeaders);
                    setExecutionResult(result);
                } catch (err) { 
                    setExecutionResult({ status: 'error', error: err.response?.data?.detail || err.message });
                } finally { 
                    setIsExecuting(false); 
                }
            };

            return React.createElement(motion.div, {
                initial: { opacity: 0 }, animate: { opacity: 1 }, exit: { opacity: 0 },
                className: 'fixed inset-0 z-[100] flex items-center justify-center p-6 bg-background/80 backdrop-blur-xl'
            },
                React.createElement(motion.div, {
                    initial: { scale: 0.9, y: 20 }, animate: { scale: 1, y: 0 },
                    className: 'w-full max-w-2xl glass rounded-[42px] overflow-hidden flex flex-col max-h-[90vh]'
                },
                    React.createElement('div', { className: 'p-8 border-b border-white/5' },
                        React.createElement('div', { className: 'flex justify-between items-start mb-6' },
                            React.createElement('div', null,
                                React.createElement('h2', { className: 'text-2xl font-black text-neonCyan mb-1' }, 'Manual API Test'),
                                React.createElement('p', { className: 'text-[10px] text-gray-500 font-mono' }, endpoint.operationId)
                            ),
                            React.createElement('button', { onClick: onClose, className: 'text-gray-500 hover:text-white' },
                                React.createElement(LucideIcon, { name: 'X', className: 'w-6 h-6' })
                            )
                        ),
                        React.createElement('div', { className: 'flex items-center gap-4 bg-white/5 p-4 rounded-2xl' },
                            React.createElement('div', { className: 'px-3 py-1 bg-neonCyan/20 text-neonCyan border border-neonCyan/30 rounded-lg text-[10px] font-black uppercase' }, endpoint.method),
                            React.createElement('div', { className: 'text-xs font-mono text-gray-400' }, endpoint.path)
                        )
                    ),
                    React.createElement('div', { className: 'flex-1 p-8 space-y-6 overflow-y-auto custom-scrollbar' },
                        apiDetails && React.createElement('div', { className: 'space-y-3 p-6 bg-white/[0.03] rounded-3xl border border-white/5' },
                            React.createElement('h3', { className: 'text-[11px] font-black uppercase text-neonPurple tracking-widest' }, 'Documentation'),
                            React.createElement('p', { className: 'text-sm font-bold text-white' }, apiDetails.summary),
                            React.createElement('p', { className: 'text-xs text-gray-400 leading-relaxed' }, apiDetails.description),
                            apiDetails.request_schema && React.createElement('div', { className: 'mt-4 pt-4 border-t border-white/5' },
                                React.createElement('button', { 
                                    onClick: () => setShowSchema(!showSchema),
                                    className: 'flex items-center gap-2 text-[9px] font-black text-gray-500 uppercase hover:text-neonCyan transition-colors'
                                }, 
                                    React.createElement(LucideIcon, { name: showSchema ? 'ChevronUp' : 'ChevronDown', className: 'w-3 h-3' }),
                                    'View Request Schema'
                                ),
                                showSchema && React.createElement('pre', { className: 'mt-3 p-4 bg-black/40 rounded-xl text-[10px] font-mono text-gray-500 overflow-x-auto custom-scrollbar border border-white/5' },
                                    JSON.stringify(apiDetails.request_schema, null, 2)
                                )
                            )
                        ),
                        !executionResult ? (
                            React.createElement('div', { className: 'space-y-6' },
                                React.createElement('div', null,
                                    React.createElement('label', { className: 'text-[10px] font-black text-gray-500 uppercase tracking-widest mb-3 block' }, 'Custom Headers (JSON)'),
                                    React.createElement('textarea', {
                                        value: headers, onChange: (e) => setHeaders(e.target.value),
                                        className: 'w-full h-24 bg-black/40 border border-white/10 rounded-2xl p-4 font-mono text-xs outline-none focus:border-neonPurple/50 custom-scrollbar',
                                        spellCheck: false,
                                        disabled: isExecuting
                                    })
                                ),
                                React.createElement('div', null,
                                    React.createElement('div', { className: 'flex justify-between items-center mb-3' },
                                        React.createElement('label', { className: 'text-[10px] font-black text-gray-500 uppercase tracking-widest' }, 'Request Payload (JSON)'),
                                        React.createElement('button', { onClick: generatePayload, disabled: isGenerating || isExecuting, className: 'flex items-center gap-2 text-[10px] font-black text-neonPurple hover:text-white uppercase'}, 
                                            React.createElement(LucideIcon, { name: 'Sparkles', className: `w-3 h-3 ${isGenerating ? 'animate-spin' : ''}` }),
                                            isGenerating ? 'Generating...' : 'AI Generate'
                                        )
                                    ),
                                    React.createElement('textarea', {
                                        value: payload, onChange: (e) => setPayload(e.target.value),
                                        className: 'w-full h-48 bg-black/40 border border-white/10 rounded-2xl p-6 font-mono text-sm outline-none focus:border-neonCyan/50 custom-scrollbar',
                                        spellCheck: false,
                                        disabled: isExecuting
                                    })
                                )
                            )
                        ) : (
                            React.createElement('div', { className: 'space-y-6' },
                                React.createElement('div', { className: 'flex items-center justify-between' },
                                    React.createElement('div', { className: 'flex items-center gap-4' },
                                        React.createElement('div', { className: `px-4 py-2 rounded-xl text-xs font-black uppercase tracking-widest ${executionResult.status === 'success' ? 'bg-success/20 text-success' : 'bg-error/20 text-error'}` }, 
                                            executionResult.status === 'success' ? 'PASS' : 'FAIL'
                                        ),
                                        React.createElement('span', { className: 'text-sm font-bold text-gray-400' }, `Status Code: ${executionResult.code || 'ERR'}`)
                                    ),
                                    React.createElement('button', { onClick: () => setExecutionResult(null), className: 'text-[10px] font-black text-neonCyan uppercase tracking-widest' }, 'Edit & Retry')
                                ),
                                React.createElement('div', null,
                                    React.createElement('label', { className: 'text-[10px] font-black text-gray-500 uppercase tracking-widest mb-3 block' }, 'Response Body'),
                                    React.createElement('div', { className: 'w-full bg-black/60 border border-white/10 rounded-2xl p-6 font-mono text-xs overflow-x-auto custom-scrollbar' },
                                        React.createElement('pre', { className: 'text-gray-300' }, JSON.stringify(executionResult.data || executionResult.error, null, 2))
                                    )
                                )
                            )
                        )
                    ),
                    React.createElement('div', { className: 'p-8 bg-white/5 flex gap-4' },
                        !executionResult ? (
                            React.createElement('button', {
                                onClick: handleExecute,
                                disabled: isExecuting,
                                className: 'flex-1 py-4 bg-neonCyan text-black rounded-2xl text-[10px] font-black uppercase tracking-[2px] transition-all shadow-lg shadow-neonCyan/20 flex items-center justify-center gap-3'
                            }, 
                                isExecuting && React.createElement(LucideIcon, { name: 'Loader2', className: 'w-4 h-4 animate-spin' }),
                                isExecuting ? 'Executing...' : 'Execute Request'
                            )
                        ) : (
                            React.createElement('button', {
                                onClick: onClose,
                                className: 'flex-1 py-4 bg-white/10 text-white rounded-2xl text-[10px] font-black uppercase tracking-[2px] transition-all'
                            }, 'Done')
                        ),
                        React.createElement('button', { onClick: onClose, className: 'px-8 py-4 bg-white/5 border border-white/10 rounded-2xl text-[10px] font-black uppercase tracking-[2px]' }, 'Cancel')
                    )
                )
            );
        };

        const AnalysisModal = ({ result, onClose }) => {
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [chatMessages, setChatMessages] = useState([]);
            const [userInput, setUserInput] = useState('');
            const [currentStreamText, setCurrentStreamText] = useState('');
            const [copied, setCopied] = useState(false);

            const streamAnalysis = async (msg) => {
                setIsAnalyzing(true); setCurrentStreamText('');
                try {
                    const response = await fetch('/api/v1/meta/analyze/stream', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            operation_id: result.op,
                            result: result.result,
                            user_context: msg,
                            history: chatMessages.map(m => ({ role: m.role, content: m.text }))
                        })
                    });

                                React.createElement('span', { className: 'text-[9px] font-black uppercase tracking-widest text-neonCyan' }, 'Live Logs'),

                                [{ l: 'Passed', v: summary.passed, c: 'text-success' }, { l: 'Failed', v: summary.failed, c: 'text-error' }].map(it => React.createElement('div', { key: it.l, className: 'flex-1 p-3 bg-white/5 rounded-2xl' },
