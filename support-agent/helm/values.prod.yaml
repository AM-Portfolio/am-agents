# Prod values — durable Postgres memory (deploy still gated off in CI).
# Vault folder: apps/data/prod/services/am-agents (prod stores the ops secret here).
environment: prod

vault:
  enabled: true
  secretPaths:
    am-agents-ops:
      path: "apps/data/prod/services/am-agents"

# Profile-specific settings stay in the environment overlay.
env:
  DEPLOYMENT_ENVIRONMENT: "prod"
  SUPPORT_AGENT_RUNTIME_MODE: "prod"
  LANGFUSE_ENABLED: "true"
  LANGFUSE_HOST: "http://langfuse-web.am-ai.svc.cluster.local:3000"
