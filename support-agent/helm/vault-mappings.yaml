# Vault-injected secrets for am-support-agent (one common folder).
#
# Mapping: pod env-var -> Vault key (tool-agent style).
# Path (per env in values.{env}.yaml):
#   apps/data/{env}/services/am-agents
#   (UI: apps/{env}/services/am-agents)
#
# Keys on that secret include DB url, GrowthBook, Zoho, Cliq, OpenProject,
# Langfuse, MinIO, Grafana, LiteLLM, Temporal, MCP.
vault:
  secretPaths:
    am-agents-ops:
      mappings:
        SUPPORT_AGENT_DATABASE_URL: "url"
        GROWTHBOOK_CLIENT_KEY: "GROWTHBOOK_CLIENT_KEY"
        GROWTHBOOK_API_HOST: "GROWTHBOOK_API_HOST"
        GROWTHBOOK_ROUTE_FEATURE_KEY: "GROWTHBOOK_ROUTE_FEATURE_KEY"
        GROWTHBOOK_CACHE_TTL_SECONDS: "GROWTHBOOK_CACHE_TTL_SECONDS"
        GROWTHBOOK_RETRY_SECONDS: "GROWTHBOOK_RETRY_SECONDS"
        ZOHO_CLIENT_ID: "ZOHO_CLIENT_ID"
        ZOHO_CLIENT_SECRET: "ZOHO_CLIENT_SECRET"
        ZOHO_REFRESH_TOKEN: "ZOHO_REFRESH_TOKEN"
        ZOHO_MAIL_ACCESS_TOKEN: "ZOHO_MAIL_ACCESS_TOKEN"
        ZOHO_MAIL_ACCOUNT_ID: "ZOHO_MAIL_ACCOUNT_ID"
        ZOHO_MAIL_FROM: "ZOHO_MAIL_FROM"
        ZOHO_MAIL_USER: "ZOHO_MAIL_USER"
