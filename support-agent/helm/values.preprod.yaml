# Preprod: durable Postgres memory + GrowthBook shadow routing.
vault:
  enabled: true
  secretPaths:
    growthbook:
      path: "apps/data/preprod/services/am-support-agent"
    postgres:
      path: "apps/data/preprod/services/am-support-agent"

env:
  DEPLOYMENT_ENVIRONMENT: "preprod"
  SUPPORT_AGENT_CANARY_MODE: "shadow"
  SUPPORT_AGENT_CANARY_PERCENT: "0"
  GROWTHBOOK_ENABLED: "true"
  SUPPORT_AGENT_RUNTIME_MODE: "prod"
  SUPPORT_AGENT_REQUIRE_LIVE_ADAPTERS: "false"
  SUPPORT_AGENT_RUNSTORE: "postgres"
  SUPPORT_AGENT_WORKFLOW_STORE: "postgres"
  SUPPORT_AGENT_EPISODE_STORE: "postgres"
  SUPPORT_AGENT_FEEDBACK_STORE: "postgres"
