[project]
name = "am-support-agent"
version = "0.1.0"
description = "support-agent — A2A orchestrator (parallel to legacy gateway/worker until production gates)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "httpx>=0.27,<1",
  "growthbook>=2.3.1,<3",
  "pydantic>=2.6,<3",
  "pyyaml>=6.0,<7",
  "opentelemetry-api~=1.40.0",
  "opentelemetry-sdk~=1.40.0",
  "opentelemetry-exporter-otlp-proto-http~=1.40.0",
  "opentelemetry-instrumentation-fastapi==0.61b0",
  "opentelemetry-instrumentation-httpx==0.61b0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]
temporal = [
  "temporalio>=1.7,<2",
]
postgres = [
  "psycopg[binary]>=3.1,<4",
  "opentelemetry-instrumentation-psycopg==0.61b0",
]

[project.scripts]
am-support-agent-gateway = "am_support_agent.gateway.app:main"
am-support-agent-worker = "am_support_agent.orchestrator.worker_main:main"
am-support-agent-retention = "am_support_agent.stores.retention:main"
am-support-agent-offline-eval = "am_support_agent.learning.offline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/am_support_agent"]

[tool.hatch.build.targets.wheel.force-include]
"registry/agents.yaml" = "am_support_agent/registry/agents.yaml"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
