apiVersion: apps/v1
kind: Deployment
metadata:
  name: support-agent-gateway
  labels:
    app: support-agent-gateway
    app.kubernetes.io/name: support-agent
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: support-agent-gateway
  template:
    metadata:
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
      labels:
        app: support-agent-gateway
        app.kubernetes.io/name: support-agent
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            {{- range $k, $v := .Values.env }}
            {{- if or (not $.Values.persistence.enabled) (and (ne $k "SUPPORT_AGENT_RUNSTORE") (ne $k "SUPPORT_AGENT_SQLITE_PATH")) }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.persistence.enabled }}
            - name: SUPPORT_AGENT_RUNSTORE
              value: "sqlite"
            - name: SUPPORT_AGENT_SQLITE_PATH
              value: "{{ .Values.persistence.mountPath }}/support-agent-runs.db"
            {{- end }}
            - name: SUPPORT_AGENT_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ .Values.secretKeys.apiToken }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsUser: 10001
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: support-agent-gateway-data
        {{- end }}
{{- if .Values.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: support-agent-gateway-data
  labels:
    app: support-agent-gateway
    app.kubernetes.io/name: support-agent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- if .Values.persistence.storageClassName }}
  storageClassName: {{ .Values.persistence.storageClassName | quote }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: support-agent-gateway
  labels:
    app: support-agent-gateway
spec:
  type: {{ .Values.service.type }}
  selector:
    app: support-agent-gateway
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
{{- if .Values.worker.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: support-agent-worker
  labels:
    app: support-agent-worker
    app.kubernetes.io/name: support-agent
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app: support-agent-worker
  template:
    metadata:
      labels:
        app: support-agent-worker
        app.kubernetes.io/name: support-agent
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["am-support-agent-worker"]
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            - name: TEMPORAL_HOST
              value: {{ .Values.worker.temporal.host | quote }}
            - name: TEMPORAL_NAMESPACE
              value: {{ .Values.worker.temporal.namespace | quote }}
            - name: TEMPORAL_TASK_QUEUE
              value: {{ .Values.worker.temporal.taskQueue | quote }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsUser: 10001
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
