[project]
name = "platform-worker"
version = "0.1.0"
description = "Temporal worker for AM agent platform (AlertIncident MVP)"
requires-python = ">=3.11"
dependencies = [
  "temporalio>=1.7,<2",
  "am-platform-ports>=0.1.0",
  "am-platform-adapters>=0.1.0",
  "agent-common>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
platform-worker = "platform_worker.worker_main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
