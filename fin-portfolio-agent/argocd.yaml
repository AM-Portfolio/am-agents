apiVersion: am.argocd/v1
kind: ServiceDeploy
service: am-fin-agent
enabled: true
owners: agents
source:
  repo: am-agents
  path: fin-portfolio-agent/argocd.yaml
chart:
  repoURL: https://github.com/AM-Portfolio/am-pipelines.git
  path: helm/universal-chart
  targetRevision: main
helm:
  releaseName: am-fin-agent
  valuesPath: fin-portfolio-agent/helm
valuesRepoURL: https://github.com/AM-Portfolio/am-agents.git
valuesTargetRevision: main
envs:
  prod:
    enabled: true
    namespace: am-apps-prod
