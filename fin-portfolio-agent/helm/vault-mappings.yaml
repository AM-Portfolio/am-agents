vault:
  secretPaths:
    mongodb:
      mappings:
        MONGODB_URI: "url"
    redis:
      template: |
        export REDIS_URL="redis://:{{ .Data.data.password }}@{{ .Data.data.host }}:{{ .Data.data.port }}/0"
    observability:
      mappings:
        LANGFUSE_PUBLIC_KEY: "LANGFUSE_PUBLIC_KEY"
        LANGFUSE_SECRET_KEY: "LANGFUSE_SECRET_KEY"
    llm-api-keys:
      mappings:
        LITELLM_MASTER_KEY: "LITELLM_MASTER_KEY"
    otel:
      mappings:
        TRACING_SAMPLING_PROBABILITY: "TRACING_SAMPLING_PROBABILITY"
