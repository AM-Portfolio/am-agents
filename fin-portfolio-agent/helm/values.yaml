# Base values for universal-chart (amctl / CI). Env overlays in values.<env>.yaml.

# Keep nameOverride unset so selector stays app.kubernetes.io/name=universal-chart
# (immutable on existing am-fin-agent Deployment).
fullnameOverride: am-fin-agent

global:
  image:
    registry: ghcr.io/am-portfolio
    pullPolicy: Always
  vault:
    enabled: true
    authPath: auth/kubernetes
    role: am-backend-role
    serviceAccountName: am-backend-sa

image:
  repository: am-fin-agent
  pullPolicy: Always

replicaCount: 1
language: python
port: 8080

service:
  port: 8080

entrypoint: "exec uvicorn am_fin_portfolio_analysis.api:app --host 0.0.0.0 --port 8080"

env:
  AUTH_REQUIRED: "true"
  AM_MCP_SERVER_URL: "http://am-mcp-server.am-apps-dev.svc.cluster.local:8080"
  DATA_FALLBACK_REST: "false"
  MCP_TOOL_BLOCKLIST: "ask_finance_agent"
  LLM_ROUTING: "direct"
  LITELLM_BASE_URL: "http://litellm.am-ai.svc.cluster.local:4000"
  LLM_MODEL: "together_ai/meta-llama/Meta-Llama-3-8B-Instruct-Lite"
  LANGFUSE_ENABLED: "true"
  LANGFUSE_HOST: "https://langfuse.munish.org"
  LANGFUSE_ENV: "dev"
  LANGFUSE_TRACE_MAX_OUTPUT_CHARS: "8000"
  LANGFUSE_TOOL_PAYLOAD_MODE: "full"
  PROMPT_SOURCE: "langfuse"
  PROMPT_LABEL: "dev"
  PROMPT_CACHE_TTL_SECONDS: "60"
  CORS_ORIGINS: "https://am.asrax.in,https://am-dev.asrax.in,http://localhost:9000"

probes:
  port: 8080
  liveness:
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 30
  readiness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
  startup:
    path: /health
    failureThreshold: 30
    periodSeconds: 10

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 250m
    memory: 512Mi

hostAliases:
  - ip: 203.174.22.129
    hostnames:
      - redis.asrax.in
      - mongodb.asrax.in
      - kafka.asrax.in

security:
  automountServiceAccountToken: true

ingress:
  enabled: false
