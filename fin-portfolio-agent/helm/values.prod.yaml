environment: prod
replicaCount: 1

vault:
  enabled: true
  secretPaths:
    otel:
      path: "apps/data/prod/infra/observability"
    mongodb:
      path: "apps/data/prod/infra/mongodb"
    redis:
      path: "apps/data/prod/infra/redis"
    observability:
      path: "apps/data/prod/services/am-mcp-gateway"
    llm-api-keys:
      path: "apps/data/prod/services/am-mcp-gateway"

ingress:
  enabled: true
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: >-
      am-apps-prod-global-cors@kubernetescrd,
      am-apps-prod-strip-prefix-apps@kubernetescrd
  hosts:
    - host: am.asrax.in
      paths:
        - path: /ai
          pathType: Prefix

env:
  APP_ENV: prod
  AI_WRITE_TOOLS_ENABLED: "false"
