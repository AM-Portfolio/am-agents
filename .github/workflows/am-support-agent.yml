name: AM Support Agent Publish

on:
  push:
    branches: ["main", "develop", "test/**", "feature/**", "hotfix/**", "fix/**"]
    paths:
      - "support-agent/**"
      - ".dockerignore"
      - ".github/workflows/am-support-agent.yml"
  pull_request:
    branches: ["main", "develop", "test/**", "feature/**", "hotfix/**", "fix/**"]
    paths:
      - "support-agent/**"
      - ".dockerignore"
      - ".github/workflows/am-support-agent.yml"
  workflow_dispatch:

jobs:
  publish:
    name: Publish am-support-agent
    permissions:
      contents: write
      packages: write
    uses: AM-Portfolio/am-pipelines/.github/workflows/central-build-publish-contabo.yml@main
    with:
      language: "python"
      working_directory: "support-agent"
      image_name: "am-support-agent"
      build_context: "."
    secrets: inherit
