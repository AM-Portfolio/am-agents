name: AM Fin Agent Publish

on:
  push:
    branches: ["main", "develop", "test/**", "feature/**", "hotfix/**", "fix/**"]
    paths:
      - "fin-portfolio-agent/**"
      - ".dockerignore"
      - ".github/workflows/am-fin-agent.yml"
  pull_request:
    branches: ["main", "develop", "test/**", "feature/**", "hotfix/**", "fix/**"]
    paths:
      - "fin-portfolio-agent/**"
      - ".dockerignore"
      - ".github/workflows/am-fin-agent.yml"
  workflow_dispatch:

jobs:
  test:
    name: Test fin-portfolio-agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fin-portfolio-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            fin-portfolio-agent/requirements.txt
            fin-portfolio-agent/pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[test]" || true
      - name: Unit tests
        run: >
          pytest tests/ -q
          --ignore=tests/test_mongodb.py
          --ignore=tests/test_real_llm.py
          --ignore=tests/verify.py
      - name: Compile check
        run: python -m compileall -q am_fin_portfolio_analysis shared

  helm:
    name: Validate fin-agent Helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Assert chart and values
        run: |
          test -f fin-portfolio-agent/.am.yaml
          test -f fin-portfolio-agent/Dockerfile
          test -f fin-portfolio-agent/helm/Chart.yaml
          test -f fin-portfolio-agent/helm/values.yaml
          test -f fin-portfolio-agent/helm/values.dev.yaml
          test -f fin-portfolio-agent/helm/vault-mappings.yaml
          grep -q 'name: am-fin-agent' fin-portfolio-agent/.am.yaml
          grep -q 'release: am-fin-agent' fin-portfolio-agent/.am.yaml
          grep -q 'fullnameOverride: am-fin-agent' fin-portfolio-agent/helm/values.yaml
          grep -q 'AUTH_REQUIRED' fin-portfolio-agent/helm/values.yaml
          grep -q 'AM_MCP_SERVER_URL' fin-portfolio-agent/helm/values.yaml
          grep -q 'AUTH_JWKS_URL' fin-portfolio-agent/helm/vault-mappings.yaml
          grep -q 'LITELLM_MASTER_KEY' fin-portfolio-agent/helm/vault-mappings.yaml
          ! grep -E '(password|api_key|secret):' fin-portfolio-agent/helm/values*.yaml
      - name: Lint chart
        run: helm lint fin-portfolio-agent/helm

  publish:
    name: Publish AM Fin Agent
    needs: [test, helm]
    permissions:
      contents: read
      packages: write
    uses: AM-Portfolio/am-pipelines/.github/workflows/central-build-publish.yml@main
    with:
      language: "python"
      working_directory: "fin-portfolio-agent"
      image_name: "am-fin-agent"
      # Dockerfile COPYs fin-portfolio-agent/* — context is repo root (parent of working_directory)
      build_context: ".."
      preprod_namespace: "am-apps-preprod"
      prod_namespace: "am-apps-prod"
      deploy_dev: true
      deploy_prod: true
    secrets: inherit
