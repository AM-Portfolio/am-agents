name: AM DB Agent Publish

on:
  push:
    branches: ["main", "develop", "test/**", "feature/**", "hotfix/**", "fix/**"]
    paths:
      - "db-agent/**"
      - ".dockerignore"
  pull_request:
    branches: ["main", "develop", "test/**", "feature/**", "hotfix/**", "fix/**"]
    paths:
      - "db-agent/**"
      - ".dockerignore"
  workflow_dispatch:

jobs:
  publish:
    name: Publish am-db-agent
    permissions:
      contents: write
      packages: write
    uses: AM-Portfolio/am-pipelines/.github/workflows/central-build-publish-contabo.yml@main
    with:
      language: "python"
      working_directory: "db-agent"
      image_name: "am-db-agent"
      build_context: "."
    secrets: inherit
