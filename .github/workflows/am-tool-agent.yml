name: AM Tool Agent Publish

on:
  push:
    branches: ["main", "develop", "test/**", "feature/**", "hotfix/**", "fix/**"]
    paths:
      - ".github/workflows/am-tool-agent.yml"
      - "tool-agent/**"
      - ".dockerignore"
  pull_request:
    branches: ["main", "develop", "test/**", "feature/**", "hotfix/**", "fix/**"]
    paths:
      - ".github/workflows/am-tool-agent.yml"
      - "tool-agent/**"
      - ".dockerignore"
  workflow_dispatch:

jobs:
  publish:
    name: Publish am-tool-agent
    permissions:
      contents: write
      packages: write
    uses: AM-Portfolio/am-pipelines/.github/workflows/central-build-publish-contabo.yml@main
    with:
      language: "python"
      working_directory: "tool-agent"
      image_name: "am-tool-agent"
      build_context: "."
    secrets: inherit
