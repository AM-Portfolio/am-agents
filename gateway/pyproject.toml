[project]
name = "agent-gateway"
version = "0.1.0"
description = "L2 chat gateway — Temporal Start/Signal/status + auth (Phase 5)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "temporalio>=1.7,<2",
  "am-platform-ports>=0.1.0",
  "am-platform-adapters>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
agent-gateway = "agent_gateway.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
