# amctl deploy config for tool-agent.
# Secrets stay in Vault (helm/vault-mappings.yaml); do not put credentials here.

name: am-tool-agent
release: am-tool-agent
runtime: python
language: python
dockerfile: Dockerfile
context: .
image: ghcr.io/am-portfolio/am-tool-agent
github:
  repo: AM-Portfolio/am-agents
  deploy_workflow: deploy-am-tool-agent.yml
  service: am-tool-agent
  ref: main
deploy:
  via: actions
  rebuild: on-change

