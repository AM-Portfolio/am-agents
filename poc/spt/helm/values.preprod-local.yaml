# Local POC deploy — vault off, use env from values.yaml only
environment: preprod

vault:
  enabled: false

global:
  vault:
    enabled: false

ingress:
  annotations:
    traefik.ingress.kubernetes.io/router.priority: "100"
    traefik.ingress.kubernetes.io/router.middlewares: >-
      am-apps-preprod-global-cors@kubernetescrd,
      am-apps-preprod-strip-prefix-apps@kubernetescrd
  hosts:
    - host: am.asrax.in
      paths:
        - path: /spt-poc
          pathType: Prefix

env:
  APP_ENV: preprod
  OCTOPERF_MCP_URL: "https://api.octoperf.com/mcp"
