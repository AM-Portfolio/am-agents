global:
  image:
    registry: ghcr.io/am-portfolio
    pullPolicy: Always
    imagePullSecrets:
      - name: regcred
  vault:
    enabled: true
    role: am-backend-role
    authPath: auth/kubernetes
    serviceAccountName: am-backend-sa

image:
  repository: am-spt-poc

replicaCount: 1
language: python
port: 8150

service:
  port: 8150

entrypoint: "exec uvicorn app.main:app --host 0.0.0.0 --port 8150"

security:
  automountServiceAccountToken: true

config: {}

env:
  APP_NAME: am-spt-poc
  APP_PORT: "8150"
  LOG_LEVEL: INFO
  TZ: Asia/Kolkata
  POC_TARGET_URL: "https://httpbin.org/get"
  OCTOPERF_MCP_URL: "https://api.octoperf.com/mcp"
  MCP_TIMEOUT_SECONDS: "60"
  SMOKE_POLL_MAX_SECONDS: "600"
  SMOKE_VUS: "5"
  SMOKE_DURATION: "1m"

probes:
  port: 8150
  startup:
    path: /health
    failureThreshold: 30
    periodSeconds: 10
  liveness:
    path: /health
  readiness:
    path: /ready

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

ingress:
  enabled: true
  className: traefik
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
