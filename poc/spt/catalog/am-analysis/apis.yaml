# am-analysis — live dev service (AnalysisController + Postman collection)
# Auth: am-identity POST /auth/login → Bearer token (userId from JWT sub)
base_url: "{{target_url}}"
apis:
  - id: actuator.health
    name: "GET /actuator/health"
    method: GET
    path: "/actuator/health"
    headers:
      Accept: "application/json"
    checks:
      - status_2xx

  - id: dashboard.summary
    name: "GET /v1/analysis/dashboard/summary"
    method: GET
    path: "/v1/analysis/dashboard/summary"
    headers:
      Accept: "application/json"
      Authorization: "{{env.SPT_AUTH_TOKEN}}"
    checks:
      - status_2xx

  - id: dashboard.top_movers
    name: "GET /v1/analysis/dashboard/top-movers"
    method: GET
    path: "/v1/analysis/dashboard/top-movers"
    headers:
      Accept: "application/json"
      Authorization: "{{env.SPT_AUTH_TOKEN}}"
    query:
      timeFrame: "1D"
    checks:
      - status_2xx

  - id: dashboard.performance
    name: "GET /v1/analysis/dashboard/performance"
    method: GET
    path: "/v1/analysis/dashboard/performance"
    headers:
      Accept: "application/json"
      Authorization: "{{env.SPT_AUTH_TOKEN}}"
    query:
      timeFrame: "1M"
    checks:
      - status_2xx

  - id: dashboard.recent_activity
    name: "GET /v1/analysis/dashboard/recent-activity"
    method: GET
    path: "/v1/analysis/dashboard/recent-activity"
    headers:
      Accept: "application/json"
      Authorization: "{{env.SPT_AUTH_TOKEN}}"
    query:
      page: "0"
      size: "10"
    checks:
      - status_2xx
