base_url: "{{target_url}}"
apis:
  - id: health.get
    name: "GET /health"
    method: GET
    path: "/get"
    headers:
      Accept: "application/json"
    body: null
    checks:
      - status_2xx

  - id: httpbin.get
    name: "GET /get (httpbin)"
    method: GET
    path: "/get"
    headers:
      Accept: "application/json"
      User-Agent: "am-spt-poc/1.0"
    body: null
    checks:
      - status_2xx

  - id: httpbin.post
    name: "POST /post"
    method: POST
    path: "/post"
    headers:
      Content-Type: "application/json"
      Accept: "application/json"
    body: '{"source":"spt-poc","action":"load-test"}'
    checks:
      - status_2xx

  - id: httpbin.headers
    name: "GET /headers"
    method: GET
    path: "/headers"
    headers:
      Accept: "application/json"
      X-Test-Run: "{{run_id}}"
    body: null
    checks:
      - status_2xx

  - id: httpbin.status200
    name: "GET /status/200"
    method: GET
    path: "/status/200"
    headers: {}
    body: null
    checks:
      - status_2xx

  - id: httpbin.delay
    name: "GET /delay/1"
    method: GET
    path: "/delay/1"
    headers:
      Accept: "application/json"
    body: null
    checks:
      - status_2xx

  - id: httpbin.uuid
    name: "GET /uuid"
    method: GET
    path: "/uuid"
    headers:
      Accept: "application/json"
    body: null
    checks:
      - status_2xx

  - id: httpbin.user_agent
    name: "GET /user-agent"
    method: GET
    path: "/user-agent"
    headers: {}
    body: null
    checks:
      - status_2xx

  - id: httpbin.ip
    name: "GET /ip"
    method: GET
    path: "/ip"
    headers:
      Accept: "application/json"
    body: null
    checks:
      - status_2xx

  - id: httpbin.bytes
    name: "GET /bytes/128"
    method: GET
    path: "/bytes/128"
    headers: {}
    body: null
    checks:
      - status_2xx
