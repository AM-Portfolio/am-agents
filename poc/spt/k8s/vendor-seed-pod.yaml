apiVersion: v1
kind: Pod
metadata:
  name: spt-vendor-seed
  namespace: load-testing
spec:
  restartPolicy: Never
  containers:
    - name: seed
      image: busybox
      command: ["sleep", "600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: am-spt-poc-data
