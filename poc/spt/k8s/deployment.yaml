---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-spt-poc
  namespace: load-testing
spec:
  stripPrefix:
    prefixes:
      - /spt-poc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: am-spt-poc
  namespace: load-testing
  labels:
    app: am-spt-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: am-spt-poc
  template:
    metadata:
      labels:
        app: am-spt-poc
    spec:
      containers:
        - name: am-spt-poc
          image: ghcr.io/am-portfolio/am-spt-poc:spt-dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8150
          env:
            - name: APP_NAME
              value: am-spt-poc
            - name: APP_PORT
              value: "8150"
            - name: POC_TARGET_URL
              value: "http://am-analysis.am-apps-dev.svc.cluster.local:8080"
            - name: DEFAULT_ENVIRONMENT
              value: "dev"
            - name: SPT_USER_ID
              value: "ssd2658"
            - name: SPT_IDENTITY_URL
              value: "http://am-identity.am-apps-dev.svc.cluster.local:8080"
            - name: SPT_AUTH_USERNAME
              value: "ssd2658@gmail.com"
            - name: SPT_AUTH_PASSWORD
              value: "@M1unish"
            - name: SPT_PUBLIC_BASE_URL
              value: "https://am.asrax.in"
            - name: LOG_LEVEL
              value: INFO
            - name: ROOT_PATH
              value: "/spt-poc"
            - name: DATA_DIR
              value: "/data"
            - name: K6_BIN
              value: "/usr/local/bin/k6"
            - name: GRAFANA_PUBLIC_URL
              value: "https://grafana.asrax.in"
            - name: GRAFANA_K6_DASHBOARD_UID
              value: "spt-load-testing"
            - name: INFLUXDB_URL
              value: "http://influxdb.infra.svc.cluster.local:8086"
            - name: INFLUXDB_ORG
              value: "am-portfolio"
            - name: INFLUXDB_BUCKET
              value: "load-testing-dev"
            - name: INFLUXDB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: am-spt-poc-influx
                  key: token
                  optional: true
            - name: MINIO_ENDPOINT
              value: "http://minio.infra.svc.cluster.local:9000"
            - name: MINIO_BUCKET
              value: "load-testing"
            - name: MINIO_PUBLIC_CONSOLE_URL
              value: "https://minio-console.asrax.in"
            - name: MAX_VUS
              value: "50"
            - name: TESTKUBE_ENABLED
              value: "false"
            - name: SPT_CATALOG_EXTERNAL
              value: "/catalog-external"
          startupProbe:
            httpGet:
              path: /health
              port: 8150
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /ready
              port: 8150
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8150
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          volumeMounts:
            - name: spt-data
              mountPath: /data
            - name: catalog-external
              mountPath: /catalog-external
              readOnly: true
      volumes:
        - name: spt-data
          persistentVolumeClaim:
            claimName: am-spt-poc-data
        - name: catalog-external
          projected:
            defaultMode: 0444
            sources:
              - configMap:
                  name: spt-catalog-am-analysis
                  optional: true
                  items:
                    - key: spt.yaml
                      path: am-analysis/spt.yaml
              - configMap:
                  name: spt-catalog-am-gateway
                  optional: true
                  items:
                    - key: spt.yaml
                      path: am-gateway/spt.yaml
              - configMap:
                  name: spt-catalog-am-mcp-server
                  optional: true
                  items:
                    - key: spt.yaml
                      path: am-mcp-server/spt.yaml

---
apiVersion: v1
kind: Service
metadata:
  name: am-spt-poc
  namespace: load-testing
  labels:
    app: am-spt-poc
spec:
  selector:
    app: am-spt-poc
  ports:
    - port: 8150
      targetPort: 8150
      protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: am-spt-poc
  namespace: load-testing
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.priority: "100"
    traefik.ingress.kubernetes.io/router.middlewares: >-
      am-apps-prod-global-cors@kubernetescrd,
      load-testing-strip-spt-poc@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: am.asrax.in
      http:
        paths:
          - path: /spt-poc
            pathType: Prefix
            backend:
              service:
                name: am-spt-poc
                port:
                  number: 8150
    - host: am-dev.asrax.in
      http:
        paths:
          - path: /spt-poc
            pathType: Prefix
            backend:
              service:
                name: am-spt-poc
                port:
                  number: 8150
