apiVersion: batch/v1
kind: Job
metadata:
  name: spt-vendor-install
  namespace: load-testing
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: install
          image: python:3.12-slim
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              mkdir -p /data/vendor/deps /data/vendor/wheels
              if [ -d /data/vendor/wheels ] && [ "$(ls -A /data/vendor/wheels 2>/dev/null | wc -l)" -gt 5 ]; then
                echo "Installing from existing wheels on PVC..."
                pip install --no-index --find-links=/data/vendor/wheels \
                  -r /config/requirements.txt -t /data/vendor/deps
              else
                echo "Downloading wheels then installing to PVC..."
                pip download -r /config/requirements.txt -d /data/vendor/wheels \
                  --default-timeout=120 --retries 10
                pip install --no-index --find-links=/data/vendor/wheels \
                  -r /config/requirements.txt -t /data/vendor/deps
              fi
              PYTHONPATH=/data/vendor/deps python -c "import fastapi, httpx, yaml; print('vendor deps ok')"
              touch /data/vendor/.ready
          volumeMounts:
            - name: data
              mountPath: /data
            - name: req
              mountPath: /config
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: am-spt-poc-data
        - name: req
          configMap:
            name: am-spt-poc-req
